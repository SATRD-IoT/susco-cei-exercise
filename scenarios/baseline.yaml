# INSTRUCTOR-DEFINED TEACHING ASSUMPTIONS, NOT MEASURED ELECTRICITY USE.
# Match the structural equations and path intensities from the separate
# CEI Sustainability Explorer's IoT baseline. Job runtimes come from Orion-LD.
name: CEI baseline (illustrative)
source: laptop
results_destination: cloud
assumptions:
  power_w:
    laptop: 10.0
    edge: 14.0
    cloud: 35.0
  paths:
    laptop_edge:
      energy_uj_per_bit: 0.10
      bandwidth_mbps: 20.0
      fixed_latency_ms: 12.0
    edge_cloud:
      energy_uj_per_bit: 0.30
      bandwidth_mbps: 40.0
      fixed_latency_ms: 28.0
    laptop_cloud:
      energy_uj_per_bit: 0.50
      bandwidth_mbps: 100.0
      fixed_latency_ms: 45.0
  deadline_s:
    cpu_compute: 15.0
    iot_aggregation: 15.0
